unbind-key -a
set -s extended-keys on

set -g prefix C-z
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set -g status-justify absolute-centre
set -g status-position top
set -g status-style  "bg=default"
set -g window-status-current-style "fg=blue bg=default bold"
set -g status-right ""
set -g status-left "#S"

bind-key -n M-s 'select-pane -L'
bind-key -n M-f 'select-pane -D'
bind-key -n M-d 'select-pane -U'
bind-key -n M-g 'select-pane -R'

bind-key -n M-w 'select-window -t -1'
bind-key -n M-v 'select-window -t +1'

bind-key -n C-M-s 'resize-pane -L 5'
bind-key -n C-M-f 'resize-pane -D 5'
bind-key -n C-M-d 'resize-pane -U 5'
bind-key -n C-M-g 'resize-pane -R 5'

bind -T prefix v copy-mode
bind -T prefix ? list-keys -N
bind -T prefix : command-prompt

bind -n C-M-v split-window -h -l 75
bind -n C-M-b split-window -v -l 25

bind -n C-M-q new-window
bind -n C-M-t kill-pane
