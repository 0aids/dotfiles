# Clear all default shortcuts
clear_all_shortcuts yes
include dank-tabs.conf
include dank-theme.conf

# sane defaults.
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

font_size 10.0

allow_remote_control yes

# workaround for ctrl+i sending tabs.
map ctrl+i send_text all \uE000

# paning.
# Enable layouts necessary for explicit splits and zooming
# enabled_layouts splits,stack

# # Status/Tab bar configuration
# tab_bar_edge top
# tab_bar_align center
# tab_bar_style fade
# tab_fade 1
# tab_bar_background none
# active_tab_title_template none
# tab_title_template "{index}"

# # Pane navigation
# map alt+s neighboring_window left
# map alt+f neighboring_window down
# map alt+d neighboring_window up
# map alt+g neighboring_window right

# # Tab navigation
# map alt+w previous_tab
# map alt+v next_tab

# # Pane resizing
# map ctrl+alt+s kitten relative_resize_kitten.py left 4
# map ctrl+alt+f kitten relative_resize_kitten.py down 4
# map ctrl+alt+d kitten relative_resize_kitten.py up 4 
# map ctrl+alt+g kitten relative_resize_kitten.py right 4

# # Pane splitting
# map ctrl+alt+v launch --location=vsplit --cwd=current
# map ctrl+alt+b launch --location=hsplit --cwd=current

# # Tab and Pane management
# map ctrl+alt+q new_tab_with_cwd
# map ctrl+alt+c close_window

# map ctrl+shift+escape kitty_shell overlay



# BEGIN_KITTY_FONTS
font_family      family='Iosevka Nerd Font Mono' style=Medium
bold_font        family='Iosevka Nerd Font Mono' style=Bold
italic_font      family='Iosevka Nerd Font Mono' style=Italic
bold_italic_font auto
# END_KITTY_FONTS